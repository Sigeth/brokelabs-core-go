apiVersion: brokelabs.io/v1alpha1
kind: CatalogSource
metadata:
  name: official
spec:
  ref: ghcr.io/sigeth/brokelabs-catalog:latest
  syncInterval: 1h
  trust:
    keyless:
      - issuer: https://token.actions.githubusercontent.com
        subjectRegExp: ^https://github\.com/Sigeth/brokelabs-challenge-.*/\.github/workflows/release\.yaml@.*$
